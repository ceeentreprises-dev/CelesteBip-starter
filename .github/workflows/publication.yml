# À chaque modification : tests, construction du guide, score de chaque produit, kits prêts en téléchargement.
name: Publication
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python CELESTBIP_MASTER.py build
      - run: python MOTEUR_PUBLICATION.py preparer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kits-publication
          path: release/publication/
          if-no-files-found: ignore
