name: Publier le site
on:
  push:
    branches: [main, claude/celestebip-business-plan-4cl3ue]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install reportlab && sudo apt-get install -y fonts-dejavu-core
      - run: python CELESTBIP_MASTER.py test && python -m unittest discover -s tests
      - run: python CELESTBIP_MASTER.py build && touch dist/.nojekyll && rm -f dist/build-manifest.json
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
