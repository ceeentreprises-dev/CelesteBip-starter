name: "Signaler un problème"
description: "Décrire un bug reproductible sans données sensibles"
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Merci ! Ne publiez ni clé, ni identifiant, ni donnée personnelle."
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: "Commande exécutée et étapes précises"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat observé
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: "Python 3.11, macOS / Linux / Windows"
  - type: checkboxes
    id: safety
    attributes:
      label: Confidentialité
      options:
        - label: "J'ai retiré les secrets et les données personnelles."
          required: true
